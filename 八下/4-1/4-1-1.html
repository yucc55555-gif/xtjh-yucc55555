<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際探險：平行線之謎</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --deep-space: #050b18;
            --star-gold: #ffd700;
            --laser-red: #ff0055;
            --success-green: #00ff88;
        }

        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }

        body {
            margin: 0;
            background-color: var(--deep-space);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 50%, #1a2a44 0%, #050b18 100%);
            background-attachment: fixed;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        /* 隱藏/顯示控制 */
        .screen { display: none; }
        .active { display: flex; flex-direction: column; }

        /* 登入畫面 */
        .login-box {
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            padding: 30px;
            margin-top: 50px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            background: #111;
            border: 1px solid var(--neon-blue);
            color: white;
            border-radius: 5px;
            font-size: 1.1rem;
        }

        /* 按鈕風格 */
        .btn {
            background: linear-gradient(45deg, #0066ff, #00f3ff);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--neon-blue);
        }

        .btn:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* 大廳 */
        .status-bar {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-blue);
        }

        .hp-bar {
            width: 100px;
            height: 15px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            background: var(--success-green);
            width: 100%;
            transition: width 0.3s;
        }

        .level-list {
            max-height: 60vh;
            overflow-y: auto;
        }

        /* 戰鬥畫面 */
        .battle-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .monster {
            font-size: 80px;
            margin: 20px 0;
            transition: transform 0.3s;
            display: inline-block;
        }

        .monster.shake { animation: shake 0.5s; }
        .monster.hit { filter: hue-rotate(90deg) brightness(1.5); }
        .monster.die { transform: scale(0); opacity: 0; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(10px); }
            50% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .question-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid var(--neon-blue);
            margin-bottom: 20px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }

        .option-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .option-btn:hover { background: rgba(0, 243, 255, 0.15); }

        /* 彈窗 */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 400px;
            padding: 25px;
            border-radius: 15px;
            z-index: 100;
            display: none;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .hint-modal { background: #554400; border: 2px solid var(--star-gold); color: white; }
        .exp-modal { background: #004422; border: 2px solid var(--success-green); color: white; }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 90;
            display: none;
        }

        .q-img {
            display: block;
            margin: 10px auto;
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .segment { text-decoration: overline; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 登入畫面 -->
        <div id="login-screen" class="screen active">
            <div class="login-box">
                <h1 style="color: var(--neon-blue);">🚀 星際探險</h1>
                <p>請輸入登機資訊以開始任務</p>
                <input type="text" id="stu-class" placeholder="班級 (例如: 801)">
                <input type="number" id="stu-no" placeholder="座號">
                <br>
                <button class="btn" onclick="startGame()">進入遊戲艙</button>
            </div>
        </div>

        <!-- 大廳畫面 -->
        <div id="lobby-screen" class="screen">
            <div class="status-bar">
                <div>
                    <span id="display-info"></span><br>
                    能源 HP: <div class="hp-bar" style="display:inline-block; vertical-align:middle;"><div id="hp-fill" class="hp-fill"></div></div>
                </div>
                <div style="text-align:right;">
                    🎖️ 勳章: <span id="medal-count">0</span> / 5
                </div>
            </div>
            <h2 style="text-align:center; color: var(--star-gold);">🌌 星系任務大廳</h2>
            <div id="level-list" class="level-list">
                <!-- 關卡按鈕動態生成 -->
            </div>
        </div>

        <!-- 戰鬥畫面 -->
        <div id="battle-screen" class="screen">
            <div class="battle-header">
                <div id="level-title" style="color: var(--neon-blue); font-weight: bold;"></div>
                <div id="monster-icon" class="monster">🛸</div>
                <div id="question-progress">進度: 1 / 5</div>
            </div>
            
            <div id="question-box" class="question-box"></div>
            
            <div id="option-container" class="option-container">
                <!-- 選項按鈕 -->
            </div>
        </div>
    </div>

    <!-- 提示/詳解彈窗 -->
    <div id="overlay" class="overlay"></div>
    <div id="hint-modal" class="modal hint-modal">
        <h3>💡 系統提示</h3>
        <p id="hint-text"></p>
        <button class="btn" style="background: var(--star-gold); color: black;" onclick="closeModal()">重試</button>
    </div>
    <div id="exp-modal" class="modal exp-modal">
        <h3>🎉 任務成功</h3>
        <p id="exp-text"></p>
        <button class="btn" style="background: var(--success-green); color: black;" onclick="nextQuestion()">下一題</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwYHDPDsgCKUFNfFlYPruhUF-f9XNjHcszHlJcimYc65sFdHidFUObbd69T8PA0AwsWhg/exec";
        
        let studentClass = "";
        let studentNo = "";
        let currentHP = 100;
        let medals = 0;
        let completedLevels = [];
        let currentLevelIndex = 0;
        let currentQuestionIndex = 0;
        let currentScore = 100;

        const monsters = ["🛸", "👾", "👽", "🤖", "☄️"];

        const levels = [
            {
                name: "4-1-1 平行線間的距離與面積",

                    },
                    {
                        q: "如圖，<i>L<sub>1</sub></i> // <i>L<sub>2</sub></i>，<span class='segment'>AB</span> = 3 ‧ <span class='segment'>BC</span> = 5，若 △<i>BCD</i> 的面積為 10，則 △<i>ACE</i> 的面積為多少？<img src='img_q3.png' class='q-img'>",

                        options: ["40", "30", "10", "50"],

                ]
            },
            {
                name: "4-2-2 平行線的截角性質",
                questions: [
                    {

                        options: ["過 P 點作一條截線交 L 於 A", "在 L 上找兩點", "作 P 點到 L 的垂線", "隨便畫一條線"],

                    },
                    {
                        q: "若利用「同位角相等」原理作平行線，所複製的角度必須與原截角位置？",
                        options: ["相同", "相反", "在內部", "在外部"],
                        ans: 0,
                        hint: "同位角的名稱含義。",
                        exp: "同位角是指相對位置相同的角。"
                    },
                    {
                        q: "已知 △<i>ABC</i>，<i>D</i> 為 <span class='segment'>AB</span> 上一點。欲在 <span class='segment'>AC</span> 上找一點 <i>E</i> 使 <span class='segment'>DE</span> // <span class='segment'>BC</span>，這是在複製哪個角？",
                        options: ["∠ABC", "∠A", "∠C", "∠ADC"],
                        ans: 0,
                        hint: "要讓 ∠<i>ADE</i> = ∠<i>ABC</i>。",
                        exp: "複製 ∠<i>ABC</i> 使其成為同位角，即可確保 <span class='segment'>DE</span> // <span class='segment'>BC</span>。"
                    }
                ]
            }
        ];

        function startGame() {
            studentClass = document.getElementById("stu-class").value;
            studentNo = document.getElementById("stu-no").value;

            if (!studentClass || !studentNo) {
                alert("請輸入班級與座號！");
                return;
            }

            document.getElementById("login-screen").classList.remove("active");
            document.getElementById("lobby-screen").classList.add("active");
            document.getElementById("display-info").innerText = `${studentClass} 班 ${studentNo} 號 探險家`;
            renderLobby();
        }

        function renderLobby() {
            const list = document.getElementById("level-list");
            list.innerHTML = "";
            levels.forEach((lvl, index) => {
                const isCompleted = completedLevels.includes(index);
                const btn = document.createElement("button");
                btn.className = "btn";
                btn.style.width = "100%";
                btn.innerHTML = `${isCompleted ? "🎖️ " : ""}${lvl.name}`;
                if (isCompleted) btn.disabled = true;
                btn.onclick = () => startBattle(index);
                list.appendChild(btn);
            });

            if (completedLevels.length === 5) {
                const winMsg = document.createElement("h2");
                winMsg.innerHTML = "🏆 獲得終極榮譽勳章！你已征服平行星系！";
                winMsg.style.textAlign = "center";
                winMsg.style.color = "var(--success-green)"; 
                list.appendChild(winMsg);
            }
        }

        function startBattle(index) {
            currentLevelIndex = index;
            currentQuestionIndex = 0;
            currentScore = 100;
            document.getElementById("lobby-screen").classList.remove("active");
            document.getElementById("battle-screen").classList.add("active");
            document.getElementById("level-title").innerText = levels[index].name;
            document.getElementById("monster-icon").innerText = monsters[index % monsters.length];
            loadQuestion();
        }

        function loadQuestion() {
            const qData = levels[currentLevelIndex].questions[currentQuestionIndex];
            document.getElementById("question-progress").innerText = `進度: ${currentQuestionIndex + 1} / 5`;
            document.getElementById("question-box").innerHTML = qData.q;
            
            const container = document.getElementById("option-container");
            container.innerHTML = "";
            
            // 隨機打亂選項
            let opts = qData.options.map((o, i) => ({ text: o, isCorrect: i === qData.ans }));
            opts.sort(() => Math.random() - 0.5);

            opts.forEach(opt => {
                const btn = document.createElement("div");
                btn.className = "option-btn";
                btn.innerHTML = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect);
                container.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                const qData = levels[currentLevelIndex].questions[currentQuestionIndex];
                // 修正：使用 innerHTML 以正確渲染數學符號格式
                document.getElementById("exp-text").innerHTML = qData.exp;
                document.getElementById("monster-icon").classList.add("hit");
                setTimeout(() => document.getElementById("monster-icon").classList.remove("hit"), 500);
                showModal("exp-modal");
            } else {
                currentHP -= 10;
                currentScore -= 20;
                updateHP();
                document.getElementById("monster-icon").classList.add("shake");
                setTimeout(() => document.getElementById("monster-icon").classList.remove("shake"), 500);
                
                const qData = levels[currentLevelIndex].questions[currentQuestionIndex];
                // 修正：使用 innerHTML 以正確渲染數學符號格式
                document.getElementById("hint-text").innerHTML = qData.hint;
                showModal("hint-modal");

                if (currentHP <= 0) {
                    alert("能源耗盡！撤回基地修復...");
                    location.reload();
                }
            }
        }

        function updateHP() {
            document.getElementById("hp-fill").style.width = currentHP + "%";
        }

        function showModal(id) {
            document.getElementById("overlay").style.display = "block";
            document.getElementById(id).style.display = "block";
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("hint-modal").style.display = "none";
            document.getElementById("exp-modal").style.display = "none";
        }

        function nextQuestion() {
            closeModal();
            currentQuestionIndex++;
            if (currentQuestionIndex < 5) {
                loadQuestion();
            } else {
                finishLevel();
            }
        }

        function finishLevel() {
            medals++;
            completedLevels.push(currentLevelIndex);
            document.getElementById("medal-count").innerText = medals;
            
            // 上傳成績
            const finalScore = Math.max(0, currentScore);
            const levelName = levels[currentLevelIndex].name;
            uploadResult(levelName, finalScore);

            document.getElementById("battle-screen").classList.remove("active");
            document.getElementById("lobby-screen").classList.add("active");
            renderLobby();
        }

        function uploadResult(lvlName, score) {
            const formData = new FormData();
            formData.append('time', new Date().toLocaleString());
            formData.append('class', studentClass);
            formData.append('no', studentNo);
            formData.append('level', lvlName);
            formData.append('score', score);

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            }).catch(e => console.error("Upload failed", e));
        }
    </script>
</body>
