<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師專屬註冊通道 - 七年級數學探險島</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .register-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 36px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      border-top: 6px solid var(--secondary-color);
    }
    .class-tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .class-tag {
      background: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .class-tag .remove-btn {
      cursor: pointer;
      color: var(--danger-red);
      font-weight: 900;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
      <span style="font-size: 32px;">👨‍🏫</span>
      <h2 style="color: var(--dark-navy); font-weight: 800;">教師專屬註冊網頁</h2>
    </div>
    <p style="font-size: 14px; color: #64748b; margin-bottom: 24px;">
      此頁面為教師專用註冊通道（請勿提供給學生）。註冊完成後即可登入教師後台，最多可設定管理 5 個任課班級。
    </p>

    <div class="form-group">
      <label>教師登入帳號 *</label>
      <input type="text" id="regUsername" class="form-control" placeholder="請輸入自訂英數帳號，例如 t_chen">
    </div>

    <div class="form-group">
      <label>登入密碼 *</label>
      <input type="password" id="regPassword" class="form-control" placeholder="請設定登入密碼">
    </div>

    <div class="form-group">
      <label>教師姓名 / 稱謂</label>
      <input type="text" id="regName" class="form-control" placeholder="例如：陳大為老師">
    </div>

    <div class="form-group">
      <label>任教學校名稱 *</label>
      <input type="text" id="regSchool" class="form-control" placeholder="例如：xtjh" value="xtjh" list="schoolOptions">
      <datalist id="schoolOptions"></datalist>
    </div>

    <div class="form-group">
      <label>任課班級設定（最多 5 個班級）*</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="classInput" class="form-control" placeholder="輸入班級名稱，例如 701、702" style="flex: 1;">
        <button type="button" class="btn-nav-outline" onclick="addClassTag()" style="white-space: nowrap;">＋ 加入班級</button>
      </div>
      <div class="class-tag-container" id="classTagsBox"></div>
      <small style="color: #64748b; display: block; margin-top: 6px;">目前已選擇 <strong id="classCountText">0</strong> / 5 個班級</small>
    </div>

    <button class="btn-primary-action" onclick="submitRegisterTeacher()" style="margin-top: 24px;">
      ✅ 完成註冊並前往教師管理後台
    </button>

    <div style="text-align: center; margin-top: 16px;">
      <a href="teacher.html" style="font-size: 14px; color: var(--secondary-color); font-weight: 700; text-decoration: none;">
        ➔ 已有教師帳號？直接點此登入
      </a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    let selectedClasses = ['701', '702'];

    document.addEventListener('DOMContentLoaded', () => {
      // 填入預設學校
      const dl = document.getElementById('schoolOptions');
      if (dl) {
        dl.innerHTML = PRESET_SCHOOLS.map(s => `<option value="${s}"></option>`).join('');
      }
      renderClassTags();
    });

    function addClassTag() {
      const input = document.getElementById('classInput');
      const rawVal = (input.value || '').trim();
      if (!rawVal) return;
      const parsed = typeof parseTeacherClasses === 'function' ? parseTeacherClasses(rawVal) : [rawVal];
      let added = false;
      parsed.forEach(val => {
        if (!selectedClasses.includes(val)) {
          if (selectedClasses.length < 5) {
            selectedClasses.push(val);
            added = true;
          }
        }
      });
      if (!added && parsed.every(v => selectedClasses.includes(v))) {
        alert('所填班級已在清單中囉！');
      } else if (selectedClasses.length >= 5 && parsed.length > 1) {
        alert('已達到最多 5 個班級限制！');
      }
      input.value = '';
      renderClassTags();
    }

    function removeClassTag(cls) {
      selectedClasses = selectedClasses.filter(c => c !== cls);
      renderClassTags();
    }

    function renderClassTags() {
      const box = document.getElementById('classTagsBox');
      box.innerHTML = selectedClasses.map(c => `
        <span class="class-tag">
          ${c} 班
          <span class="remove-btn" onclick="removeClassTag('${c}')">✕</span>
        </span>
      `).join('');
      document.getElementById('classCountText').textContent = selectedClasses.length;
    }

    async function submitRegisterTeacher() {
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const name = document.getElementById('regName').value.trim();
      const school = document.getElementById('regSchool').value.trim();

      if (!username || !password || !school) {
        alert('請填寫帳號、密碼與任教學校！');
        return;
      }
      if (selectedClasses.length === 0) {
        alert('請至少加入一個任課班級！');
        return;
      }

      try {
        const res = await dataService.registerTeacher({
          username,
          password,
          name,
          school,
          classes: selectedClasses
        });

        alert('註冊成功！系統將為您跳轉至教師後台。');
        localStorage.setItem(STORAGE_KEYS.CURRENT_TEACHER, JSON.stringify(res.teacher));
        window.location.href = 'teacher.html';
      } catch (err) {
        alert('註冊失敗：' + err.message);
      }
    }
  </script>
</body>
</html>
